name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build PWA
        run: |
          npm install
          npm run build

      - name: Prepare Capacitor Android project (com.alx.office)
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply ALX Office launcher icon
        run: |
          ICON_SRC="public/assets/aistudio/1794708396591_f43e1352.png"
          if [ -f "$ICON_SRC" ] && command -v convert >/dev/null 2>&1; then
            for dir in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
              folder="${dir%%:*}"
              size="${dir##*:}"
              mkdir -p "android/app/src/main/res/$folder"
              convert "$ICON_SRC" -resize "${size}x${size}" "android/app/src/main/res/$folder/ic_launcher.png"
              convert "$ICON_SRC" -resize "${size}x${size}" "android/app/src/main/res/$folder/ic_launcher_round.png"
            done
          fi

      - name: Build and sign Android APK
        id: build_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi

          APK_NAME="ALX-Office-${TAG}.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="../${APK_NAME}"

          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" app-release-aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASS}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASS}" \
              --out "$SIGNED_APK" \
              app-release-aligned.apk
          else
            keytool -genkeypair -v \
              -keystore debug-release.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ALX Office,O=ALX,C=ES"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug-release.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out "$SIGNED_APK" \
              app-release-aligned.apk
          fi

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_apk.outputs.apk_name }}
          path: ${{ steps.build_apk.outputs.apk_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_apk.outputs.tag }}
          name: ALX Office ${{ steps.build_apk.outputs.tag }}
          files: ${{ steps.build_apk.outputs.apk_name }}
          generate_release_notes: true
