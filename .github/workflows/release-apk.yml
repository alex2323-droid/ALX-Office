name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies and build PWA
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Prepare Capacitor Android project (com.alx.office)
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@^8.0.0 @capacitor/cli@^8.0.0 @capacitor/android@^8.0.0
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply ALX Office launcher icon
        run: |
          ICON_SRC="public/assets/aistudio/1794773231252_a0df14cb.png"
          if [ -f "$ICON_SRC" ]; then
            if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y imagemagick
            fi
            CONVERT_BIN=$(command -v magick || command -v convert)
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
              folder="${dir%%:*}"
              size="${dir##*:}"
              mkdir -p "android/app/src/main/res/$folder"
              "$CONVERT_BIN" "$ICON_SRC" -resize "${size}x${size}" "android/app/src/main/res/$folder/ic_launcher.png"
              "$CONVERT_BIN" "$ICON_SRC" -resize "${size}x${size}" "android/app/src/main/res/$folder/ic_launcher_round.png"
            done
          fi

      - name: Build and sign Android APK
        id: build_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version || '2.0.0'")

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ] && [ -n "$GITHUB_REF_NAME" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${PKG_VER}"
          fi

          VERSION_NAME="${TAG#v}"
          VERSION_CODE=$(node -e '
            const parts = (process.argv[1] || "2.0.0").split(".").map((n) => parseInt(n, 10) || 0);
            const [maj = 2, min = 0, pat = 0] = parts;
            console.log(maj * 10000 + min * 100 + pat);
          ' "$VERSION_NAME")

          VERSION_CODE="$VERSION_CODE" VERSION_NAME="$VERSION_NAME" node -e '
            const fs = require("fs");
            const code = process.env.VERSION_CODE;
            const name = process.env.VERSION_NAME;
            for (const file of ["android/app/build.gradle", "android/app/build.gradle.kts"]) {
              if (!fs.existsSync(file)) continue;
              let content = fs.readFileSync(file, "utf8");
              content = content
                .replace(/versionCode\s*=?\s*\d+/, (m) => m.includes("=") ? `versionCode = ${code}` : `versionCode ${code}`)
                .replace(/versionName\s*=?\s*["'\''][^"'\'']*["'\'']/, (m) => m.includes("=") ? `versionName = "${name}"` : `versionName "${name}"`);
              fs.writeFileSync(file, content);
            }
          '

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          APK_NAME="ALX-Office-${TAG}.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          SIGNED_APK="../${APK_NAME}"

          ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK/build-tools" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            yes | sdkmanager "build-tools;36.0.0" >/dev/null
            BUILD_TOOLS_DIR="$ANDROID_SDK/build-tools/36.0.0"
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" app-release-aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASS}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASS}" \
              --out "$SIGNED_APK" \
              app-release-aligned.apk
          else
            keytool -genkeypair -v \
              -keystore debug-release.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ALX Office,O=ALX,C=ES"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug-release.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out "$SIGNED_APK" \
              app-release-aligned.apk
          fi

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_apk.outputs.apk_name }}
          path: ${{ steps.build_apk.outputs.apk_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ALX Office ${{ steps.build_apk.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Paquete Android oficial de **ALX Office** (`com.alx.office`).
            Descarga e instala el archivo `${{ steps.build_apk.outputs.apk_name }}` directamente en tu dispositivo Android.
          files: ${{ steps.build_apk.outputs.apk_name }}
